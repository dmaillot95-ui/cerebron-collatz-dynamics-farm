name: CEREBRON Farm 02 5min Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cerebron-farm02-scheduler
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch dynamics farm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run dynamics-farm.yml --repo "${{ github.repository }}" --ref main
